[package]
name = "aura-emerge"
version = "2.14.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4.6", features = [ "derive" ] }
clap_complete = "4.6"
clap_mangen = "0.3"
colored = "3"
anyhow = "1"
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
ureq = "3.4"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
