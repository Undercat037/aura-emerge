[package]
name = "aura-emerge"
version = "2.5.0"
edition = "2021"
license = "GPL-3.0"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
clap_mangen = "0.2"
colored = "2"
anyhow = "1"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
ureq = "2"

[profile.release]
opt-level = 3
lto = true

