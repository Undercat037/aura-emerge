[package]
name = "aura-emerge"
version = "3.0.8-indev-beta"
edition = "2021"
rust-version = "1.96"
license = "GPL-3.0-only"

[dependencies]
alpm = "5.0"
alpm-utils = "5.0"

clap = { version = "4.6", features = [ "derive" ] }
clap_complete = "4.6"
clap_mangen = "0.3"
colored = "3"
anyhow = "1"

tree-sitter = "0.26"
tree-sitter-bash = "0.25"

ureq = "3.4"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
