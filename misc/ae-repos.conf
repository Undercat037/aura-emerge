# /etc/portage/ae-repos.conf
#
# Local repositories maintained by aura-emerge (aurutils-style).
# Only used with  FEATURES="localrepo"  in /etc/portage/make.conf: every
# AUR / ABS / local-PKGBUILD package emerge builds, audits and installs is
# also filed here, root-owned, so pacman knows where it came from.
#
# Opt in by adding this line to /etc/pacman.conf, AFTER the official repos
# (core / extra / multilib):
#
#   Include = /etc/portage/ae-repos.conf
#
# What you get: `pacman -Qm` no longer lists these packages, `pacman -Si
# ae-aur/<pkg>` works, and `pacman -S/-Su` can reinstall them from the
# audited copy. On a name clash the official repos win (libalpm takes the
# first db that has the name; these three come last).
#
# SigLevel Never: nothing here is signed. The packages were audited and
# sha256-pinned by emerge, and the directories are root-owned (0755), so
# nobody else can swap a file.
#
# Empty dbs are created by:
#   - the package post_install / post_upgrade hook
#   - `emerge --sync` (helper ensures them before libalpm update)
#   - the first FEATURES=localrepo publish
# so `pacman -Sy` never trips over a listed file:// server with no packages.

[ae-aur]
SigLevel = Never
Server = file:///var/lib/aura-emerge/repos/ae-aur

[ae-abs]
SigLevel = Never
Server = file:///var/lib/aura-emerge/repos/ae-abs

[ae-local]
SigLevel = Never
Server = file:///var/lib/aura-emerge/repos/ae-local
