# /etc/portage/make.conf  (or ~/.config/emerge/make.conf for per-user)
#
# System file first, then the user one; last to set a key wins.
# Flat bash-assignment syntax -- same idea as Gentoo's make.conf

# Flags spliced into every invocation, before whatever's typed on the
# command line (which always wins on a conflict). Disable for one run
# with --ignore-default-opts.
EMERGE_DEFAULT_OPTS="--pkgbuild-view --unshare-net-build"
# Or as a bash array:
# EMERGE_DEFAULT_OPTS=(--pkgbuild-view --unshare-net-build)

# Build flags, applied via a generated makepkg.conf (makepkg --config) -
# override /etc/makepkg.conf without touching it.
# Values are shell-expanded when makepkg sources them, so $(nproc) works.
CFLAGS="-march=native -O2 -pipe"
CXXFLAGS="$CFLAGS"
CPPFLAGS="$CFLAGS"
LDFLAGS="-Wl,-O1 -Wl,--sort-common -Wl,-z,relro -Wl,-z,now"
RUSTFLAGS="-C target-cpu=native"
MAKEFLAGS="-j$(nproc)"
NINJAFLAGS="-j$(nproc)"

# Bash arrays in makepkg.conf; a plain space-separated string works too.
OPTIONS=(strip docs !debug lto)
BUILDENV=(!distcc color check !sign)