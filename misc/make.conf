# /etc/portage/make.conf
#
# aura-emerge's own config. Only this system path is read (there is no
# per-user make.conf). Flat bash-assignment syntax -- same idea as Gentoo's
# make.conf: KEY="value", KEY='literal' or KEY=(a b c). Values are
# shell-expanded, so $(nproc) and $CFLAGS work.

# Flags spliced into every invocation, before whatever's typed on the
# command line (which always wins on a conflict). Modifier flags only --
# not actions such as --unmerge. Disable for one run with
# --ignore-default-opts.
EMERGE_DEFAULT_OPTS="--jobsr=8 --tree --deep"
# Or as a bash array:
# EMERGE_DEFAULT_OPTS=(--pkgbuild-view --unshare-net-build --jobsr=4)

# Theme colours for status lines (ok / warn / error / info / special).
# Values: #RRGGBB hex or named colours (red, bright-cyan, …).
COLORS="ok=#FFB3AE warn=#E7BDB9 error=#FDB1AC info=#E7BDB9 special=#cba6f7"

# Build flags, applied via a generated makepkg.conf (makepkg --config) -
# override /etc/makepkg.conf without touching it.
# Values are shell-expanded when makepkg sources them, so $(nproc) works.
CFLAGS="-march=native -O2 -pipe"
CXXFLAGS="$CFLAGS"
CPPFLAGS="$CFLAGS"
LDFLAGS="-Wl,-O1 -Wl,--sort-common -Wl,-z,relro -Wl,-z,now"
RUSTFLAGS="-C target-cpu=native"
MAKEFLAGS="-j$(nproc)"
NINJAFLAGS="-j$(nproc)"

# makepkg knobs live here, as explicit arrays (a plain space-separated
# string works too). FEATURES does NOT touch them: ccache / check / strip
# are set via BUILDENV / OPTIONS only.
OPTIONS=(strip docs !debug lto)
BUILDENV=(!distcc color check !sign)

# FEATURES is AE-only: switches for aura-emerge's own functions, with no
# mapping onto makepkg. `-name` turns a token off (last mention wins).
# Anything unknown is read and shown by `emerge --info`, but does nothing.
#
# Tokens:
#   localrepo   aurutils-style local repositories (see below)
#
# FEATURES="localrepo"

# --- localrepo ----------------------------------------------------------
# After a package from the AUR / ABS / a local PKGBUILD (--usepkgbuild) /
# a --usepkg archive was audited and installed, it is filed, root-owned,
# under /var/lib/aura-emerge/repos/ and that repo's db is refreshed:
#
#   ae-aur    AUR builds
#   ae-abs    ABS builds (--abs)
#   ae-local  --usepkgbuild and --usepkg
#
# Extras with FEATURES="localrepo":
#   - a bare AUR install whose version already sits in ae-aur is installed
#     from there (no clone, no build); --edit / --pkgbuild-view force a
#     real rebuild, -B / -F never use local binaries
#   - -C, -c and --prune also drop the package from the ae-* repos
#   - `emerge --localrepo-clean` drops entries that are no longer installed
#     (-p lists only, -a asks)
#
# The repos are filled either way; to let pacman SEE them (-Qm, -Si, -Su),
# enable them in /etc/pacman.conf, AFTER the official repos, in ONE of two
# ways. On a name clash the first repo that has the name wins, so the
# official ones keep priority.
#
# 1) include the shipped file (misc/ae-repos.conf, installed as
#    /etc/portage/ae-repos.conf):
#
#      Include = /etc/portage/ae-repos.conf
#
# 2) or write the sections yourself:
#
#      [ae-aur]
#      SigLevel = Never
#      Server = file:///var/lib/aura-emerge/repos/ae-aur
#
#      [ae-abs]
#      SigLevel = Never
#      Server = file:///var/lib/aura-emerge/repos/ae-abs
#
#      [ae-local]
#      SigLevel = Never
#      Server = file:///var/lib/aura-emerge/repos/ae-local
#
# SigLevel Never: nothing here is signed -- the packages were audited and
# sha256-pinned by emerge and the directories are root-owned (0755).
