# /etc/portage/repos.conf — Portage-style repo list for aura-emerge
# Enable: FEATURES="repos"  in /etc/portage/make.conf
#
# priority            higher = preferred (equal -> declaration order + warning)
# sync-uri            Server URL(s); $repo / $arch expanded by alpm
# include             pacman mirrorlist path (rate-mirrors / reflector OK)
# verify-signature    pacman SigLevel string
# location            optional (file:// repo dir)
#
# FEATURES="localrepo" injects ae-aur/ae-abs/ae-local at 10/9/8 if missing.
# emerge --info writes /etc/portage/ae-generated-repos.conf for:
#   Include = /etc/portage/ae-generated-repos.conf

# [g14]
# priority = 55
# sync-uri = https://arch.asus-linux.org
# verify-signature = Required DatabaseOptional

# [core]
# priority = 50
# include = /etc/pacman.d/mirrorlist
# verify-signature = Required DatabaseOptional

# [extra]
# priority = 50
# include = /etc/pacman.d/mirrorlist
# verify-signature = Required DatabaseOptional

# [multilib]
# priority = 50
# include = /etc/pacman.d/mirrorlist
# verify-signature = Required DatabaseOptional

# [ae-aur]
# priority = 10
# sync-uri = file:///var/lib/aura-emerge/repos/ae-aur
# verify-signature = Never

# [ae-abs]
# priority = 9
# sync-uri = file:///var/lib/aura-emerge/repos/ae-abs
# verify-signature = Never

# [ae-local]
# priority = 8
# sync-uri = file:///var/lib/aura-emerge/repos/ae-local
# verify-signature = Never
#
